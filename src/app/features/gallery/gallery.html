<section class="bg-black min-h-screen px-4 md:px-8 py-20">

  <div class="text-center mb-12">
    <h2 class="text-4xl md:text-5xl font-bold text-white">
      Featured Work
    </h2>

    <p class="text-zinc-400 mt-4">
      A collection of moments captured through my lens.
    </p>
  </div>

  <div
    class="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-4"
  >

    @for(photo of photos; track photo.id){

      <div
        class="mb-4 break-inside-avoid overflow-hidden rounded-2xl group cursor-pointer"
      >

        <div class="relative">

          <img
            [src]="photo.url"
            [alt]="photo.title"
            class="w-full rounded-2xl transition duration-500 group-hover:scale-105"
          />

          <div
            class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition duration-500"
          ></div>

          <div
            class="absolute bottom-0 left-0 right-0 p-4 opacity-0 group-hover:opacity-100 transition duration-500"
          >
            <h3 class="text-white font-semibold">
              {{ photo.title }}
            </h3>
          </div>

        </div>

      </div>

    }

  </div>

</section>
