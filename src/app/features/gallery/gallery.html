<section id="gallery" class="bg-black min-h-screen px-4 md:px-8 py-20">

  <!-- Heading -->
  <div class="text-center mb-12">

    <h2 class="text-4xl md:text-5xl text-white logo-font">
      Visual Stories
    </h2>

    <p class="text-zinc-400 mt-4">
      A collection of moments captured through my lens.
    </p>

  </div>

  <!-- Categories -->
  <div class="flex flex-wrap justify-center gap-3 mb-10 max-w-4xl mx-auto px-2">

    @for(category of categories; track category){

      <button
        (click)="filterCategory(category)"
        class="logo-font active:scale-95 active:border-blue-400 text-sm md:text-base px-4 md:px-5 py-2 rounded-full border border-zinc-700 text-white transition-all duration-300 hover:border-white hover:text-blue-300"
        [class.border-white]="selectedCategory === category"
        [class.text-blue-300]="selectedCategory === category"
      >
        {{ category }}
      </button>

    }

  </div>

  <!-- Masonry Gallery -->
  <div class="columns-2 lg:columns-3 xl:columns-4 gap-4">

    @for(photo of displayedPhotos; track photo.id){

      <div
        class="mb-4 break-inside-avoid overflow-hidden rounded-2xl group cursor-pointer"
        (click)="openPhoto(photo)"
      >

        <div class="relative">

          <img
            [src]="photo.url"
            [alt]="photo.publicId + ' photography by Rushikesh Mhatre'"
            loading="lazy"
            class="w-full rounded-2xl transition duration-500 group-hover:scale-105"
          />

          <!-- Hover Overlay -->
          <div
            class="absolute inset-0 pointer-events-none bg-black/0 group-hover:bg-black/30 transition duration-500"
          ></div>

          <!-- Category Badge -->
          <div
            class="absolute bottom-0 left-0 right-0 p-4 opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none"
          >

            <span
              class="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full text-sm text-white"
            >
              {{ photo.category }}
            </span>

          </div>

        </div>

      </div>

    }

  </div>

  <!-- Load More -->
  @if(displayedPhotos.length < filteredPhotos.length){

    <div class="flex justify-center mt-12">

      <button
        (click)="loadMore()"
        class="logo-font px-6 py-3 rounded-full border border-zinc-700 text-white hover:bg-white hover:text-black transition-all duration-300"
      >
        LOAD MORE
      </button>

    </div>

  }

  <!-- Fullscreen Modal -->
  @if(selectedPhoto){

    <div
      class="fixed inset-0 z-[9999] bg-black/95 flex items-center justify-center p-4"
      (click)="closePhoto()"
    >

      <!-- Close Button -->
      <button
        type="button"
        (click)="closePhoto(); $event.stopPropagation()"
        class="absolute top-5 right-5 text-white text-5xl z-[10000]"
      >
        ×
      </button>

      <!-- Full Image -->
      <img
        [src]="selectedPhoto.url"
        [alt]="selectedPhoto.publicId"
        class="max-w-full max-h-[90vh] rounded-xl shadow-2xl"
        (click)="$event.stopPropagation()"
      />

    </div>

  }

</section>
